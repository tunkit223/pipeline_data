server:
  port: 8080

spring:
  application:
    name: pipeline_data

  datasource:
    url: jdbc:postgresql://localhost:5432/pipeline_data
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
